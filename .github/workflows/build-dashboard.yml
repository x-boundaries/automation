name: Build Dashboard

on:
  push:
    paths:
      - 'tracker/**'
      - 'scripts/build_dashboard.py'
      - '.github/workflows/build-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run dashboard builder
        run: python scripts/build_dashboard.py

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dashboard/README.md
          # Only commit if there are changes to avoid error
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update tracker dashboard [skip ci]"
          git push
