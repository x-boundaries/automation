name: Build Dashboard

on:
  push:
    paths:
      - "dashboard/source_intake.md"
      - "scripts/build_dashboard.py"
      - ".github/workflows/build-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build dashboard
        run: python scripts/build_dashboard.py

      - name: Commit generated dashboard
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add dashboard/source_intake.md
          git add dashboard/README.md
          git add README.md

          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update two-document dashboard [skip ci]"
          git push
