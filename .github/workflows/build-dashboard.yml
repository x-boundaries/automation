name: Build Dashboard

on:
  push:
    paths:
      - 'tracker/**'
      - 'scripts/**'
      - '.github/workflows/build-dashboard.yml'
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1-5"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Rank tasks and build dashboard
        run: |
          python scripts/rank_tasks.py
          python scripts/build_dashboard.py

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dashboard/
          git add tracker/work_tracker.csv
          # Only commit if there are changes to avoid error
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update tracker dashboard [skip ci]"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push

      - name: Send Email Digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: "weijun.seh@x-boundaries.com"
        run: python scripts/send_email.py
