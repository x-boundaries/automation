name: member-create-uat-tests

# Focused CI for the single-member creation UAT deliverable.
#
# Windows is the authoritative target: the laptop development machine, the physical
# host, and the AutoCount VM are all Windows, and the runner's exclusive-create
# locking and PowerShell behaviour are Windows-oriented. Windows therefore runs the
# full repository suite plus a PowerShell parse check. Ubuntu runs only the portable
# focused create-UAT tests (pure Python plus the platform-neutral PowerShell library
# via pwsh) to prove cross-platform correctness of the portable components. No CI job
# contacts AutoCount, n8n, Google, or any live environment; the runner's AutoCount
# interaction is never executed here.

on:
  pull_request:
    paths:
      - "scripts/member_create_uat_*.py"
      - "scripts/ac2_member_create_uat_runner.ps1"
      - "scripts/member_create_uat_runner_lib.ps1"
      - "scripts/ac2_member_expiry_capability_probe.ps1"
      - "scripts/member_expiry_capability_probe_lib.ps1"
      - "scripts/member_lookup_shared_folder_handoff.py"
      # Delegated in-process lookup dependencies: the focused suite imports and exercises
      # these modules, so a change confined to one of them must still trigger this workflow.
      - "scripts/member_lookup_gate4_real_queue_lookup.py"
      - "scripts/ac2_member_lookup_bridge_worker.py"
      - "scripts/member_lookup_gate3c_local_bridge_runtime.py"
      - "scripts/member_lookup_gate4a_queue_precheck.py"
      - "schemas/member_create_uat_package.schema.json"
      - "config/member_create_uat_business_confirmation*.json"
      - "n8n-workflows/member_create_uat_result_mapping.workflow.json"
      - "tests/test_member_create_uat_*.py"
      - "tests/test_ac2_member_expiry_capability_probe.py"
      - "tests/test_member_lookup_shared_folder_handoff.py"
      - "tests/_create_uat_fixtures.py"
      # Test modules covering the delegated lookup closure above, plus the Windows job's own
      # authoritative full-suite entrypoint, which previously could change untriggered.
      - "tests/test_member_lookup_gate4_real_queue_lookup.py"
      - "tests/test_ac2_member_lookup_bridge_worker.py"
      - "tests/test_member_lookup_gate4a_manual_handoff.py"
      - "tests/_run_ci_full_suite.py"
      # Safety documents that the focused tests read and assert; a docs-only change to
      # any of these must still trigger this workflow so the instructions cannot regress.
      - "docs/autocount2-automation/member_expiry_capability_probe_runbook.md"
      - "docs/autocount2-automation/member_create_uat_runbook.md"
      - "docs/autocount2-automation/member_intake_shared_folder_lookup_bridge_runbook.md"
      - "README.md"
      - ".github/workflows/member-create-uat-tests.yml"
      # The focused probe tests read .gitignore and assert the private-evidence patterns
      # (claim, staging, result), so a .gitignore-only change must still trigger this
      # workflow. tests/test_ac2_member_expiry_capability_probe.py enforces mechanically
      # that every repository file the module reads or asserts appears in this filter.
      - ".gitignore"
      # AC2 migration-preflight surfaces (#140). The Windows job's full-repository suite
      # exercises tests/test_autocount_migration_preflight.py, so a pull request confined to
      # these scripts, schemas, test or runbook must still trigger this workflow instead of
      # depending on README.md happening to change alongside them. Exact entries, not globs:
      # a broad docs/, scripts/ or tests/ wildcard would widen the reviewed trigger surface
      # and break the existing exact-membership closure.
      - "docs/autocount2-automation/migration_preflight_manifest_runbook.md"
      - "schemas/autocount_migration_execution_context_evidence.schema.json"
      - "schemas/autocount_migration_preflight_manifest.schema.json"
      - "schemas/autocount_migration_routing_evidence.schema.json"
      - "scripts/autocount_migration_preflight.py"
      - "scripts/autocount_migration_preflight_contract.py"
      - "tests/test_autocount_migration_preflight.py"
  workflow_dispatch: {}

jobs:
  windows-full-suite:
    runs-on: windows-latest
    steps:
      # Check out the LITERAL head commit, never the synthetic pull-request merge ref, so the
      # tree under test is exactly the reviewed commit. On workflow_dispatch the pull_request
      # context is empty and this falls back to github.sha.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert literal exact-head checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "expected: ${EXPECTED_SHA}"
          echo "actual:   ${ACTUAL_SHA}"
          if [ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "checked-out commit is not the literal event head"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tzdata (Windows Python has no system zoneinfo database)
        shell: pwsh
        run: python -m pip install --quiet tzdata
      - name: PowerShell parse check (no execution)
        shell: pwsh
        run: |
          $files = @(
            "scripts/ac2_member_create_uat_runner.ps1",
            "scripts/member_create_uat_runner_lib.ps1",
            "scripts/ac2_member_expiry_capability_probe.ps1",
            "scripts/member_expiry_capability_probe_lib.ps1"
          )
          $failed = $false
          foreach ($f in $files) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs) | Out-Null
            if (@($errs).Count -gt 0) {
              Write-Host "Parse errors in $f"
              $errs | ForEach-Object { Write-Host $_.Message }
              $failed = $true
            } else {
              Write-Host "OK: $f"
            }
          }
          if ($failed) { exit 1 }
      - name: Focused create UAT tests
        shell: pwsh
        run: |
          python -m unittest tests.test_member_create_uat_contract tests.test_member_create_uat_approval tests.test_member_create_uat_result_precheck tests.test_member_create_uat_runner_ps tests.test_ac2_member_expiry_capability_probe
      - name: Full repository test suite (excludes the Docker/n8n live-import module)
        shell: pwsh
        # The n8n live-import dry-run module needs a Docker/n8n environment absent on
        # stock CI; it and the complete suite are validated locally on the dev/VM host.
        run: python tests/_run_ci_full_suite.py

  ubuntu-focused:
    runs-on: ubuntu-latest
    steps:
      # Same literal-head binding as the Windows job: never the merge ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert literal exact-head checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "expected: ${EXPECTED_SHA}"
          echo "actual:   ${ACTUAL_SHA}"
          if [ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "checked-out commit is not the literal event head"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PowerShell parse check (no execution)
        shell: pwsh
        run: |
          $files = @(
            "scripts/ac2_member_create_uat_runner.ps1",
            "scripts/member_create_uat_runner_lib.ps1",
            "scripts/ac2_member_expiry_capability_probe.ps1",
            "scripts/member_expiry_capability_probe_lib.ps1"
          )
          $failed = $false
          foreach ($f in $files) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs) | Out-Null
            if (@($errs).Count -gt 0) { $failed = $true; Write-Host "Parse errors in $f" }
          }
          if ($failed) { exit 1 }
      - name: Focused create UAT and shared-folder handoff tests (portable components)
        env:
          # Amendment 9's POSIX trusted-parent contract refuses a device or mount transition
          # between the traversal anchor (`/`) and the decision store's state parent. Pinning the
          # temporary root to the workspace temp directory keeps every synthetic fixture on the
          # root filesystem, so the invariant is deterministic rather than dependent on whether
          # the runner image happens to mount /tmp separately.
          #
          # This must stay at STEP level: the `runner` context is not available in a job-level
          # `env` block, and using it there fails workflow validation before any job starts.
          TMPDIR: ${{ runner.temp }}
        run: |
          python -m unittest tests.test_member_create_uat_contract tests.test_member_create_uat_approval tests.test_member_create_uat_result_precheck tests.test_member_create_uat_runner_ps tests.test_ac2_member_expiry_capability_probe tests.test_member_lookup_shared_folder_handoff
