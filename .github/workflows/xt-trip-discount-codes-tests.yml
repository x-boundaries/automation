name: xt-trip-discount-codes-tests

on:
  pull_request:
    paths:
      # XT Trip Discount Codes (#355): the inactive export, its focused offline test, its runbook, the
      # shared sender and daily health exports whose code the test runs or pins, the offline validator,
      # and the repo-root policy file that validator reads. Exact entries keep the trigger surface owned.
      - "n8n-workflows/xt_trip_discount_codes.workflow.json"
      - "tests/test_xt_trip_discount_codes_workflow.py"
      - "docs/xt_trip_discount_codes.md"
      - "n8n-workflows/ops_alert_email.workflow.json"
      - "n8n-workflows/xb_daily_health.workflow.json"
      - "n8n-workflows/README.md"
      - "n8n-workflows/scripts/validate-n8n-workflows.cjs"
      - "n8n-workflow-policy.json"
      - ".github/workflows/xt-trip-discount-codes-tests.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert literal exact-head checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository n8n exports offline
        shell: bash
        run: node n8n-workflows/scripts/validate-n8n-workflows.cjs
      - name: Run XT trip discount codes offline contracts (Node executes the committed Code nodes)
        shell: bash
        run: python -m unittest tests.test_xt_trip_discount_codes_workflow -v
      - name: Whitespace check
        shell: bash
        run: git diff --check "$(git merge-base HEAD origin/main)" HEAD
