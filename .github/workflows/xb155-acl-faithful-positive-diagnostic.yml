                  $fallbackSetterSetAclLine = Find-XB155OneLine -Lines $harnessLines -Text 'Set-Acl -LiteralPath $Path -AclObject $acl -ErrorAction Stop' -Start ($fallbackSetterStart - 1) -End ($fallbackEnd - 1)
                  $fallbackSetterCatchLine = Find-XB155OneLine -Lines $harnessLines -Text '} catch { throw "upgrade_acl_preservation_failed" }' -Start ($fallbackSetterStart - 1) -End ($fallbackEnd - 1)
