                  Add-XB155AclBreakpoint -ScriptPath $script:HarnessPath -Line $fallbackGetAclGetterLine -Action $actionGetterGet
                  Add-XB155AclBreakpoint -ScriptPath $script:HarnessPath -Line $fallbackGetterCanonicalLine -Action $actionGetterCanonical
                  Add-XB155AclBreakpoint -ScriptPath $script:HarnessPath -Line $fallbackGetterSddlLine -Action $actionGetterSddl
                  Add-XB155AclBreakpoint -ScriptPath $script:HarnessPath -Line $fallbackGetterCatchLine -Action $actionGetterCatch
                  Add-XB155AclBreakpoint -ScriptPath $script:HarnessPath -Line $fallbackSetAclGetterLine -Action $actionSetterGet
                  Add-XB155AclBreakpoint -ScriptPath $script:HarnessPath -Line $fallbackSetterApplyLine -Action $actionSetterApply
                  Add-XB155AclBreakpoint -ScriptPath $script:HarnessPath -Line $fallbackSetterSetAclLine -Action $actionSetterSetAcl
                  Add-XB155AclBreakpoint -ScriptPath $script:HarnessPath -Line $fallbackSetterCatchLine -Action $actionSetterCatch
                  Add-XB155AclBreakpoint -ScriptPath $script:HarnessPath -Line $fallbackSetterReadbackLine -Action $actionSetterReadback
                  Add-XB155AclBreakpoint -ScriptPath $script:HarnessPath -Line $fallbackSetterCompareLine -Action $actionSetterCompare
              }
              Add-XB155AclBreakpoint -ScriptPath $script:HarnessPath -Line $operationCatchLine -Action $actionOperationCatch
              if ($script:XB155AclBreakpoints.Count -ne 11) { throw 'passive_debugger_breakpoint_count_mismatch' }

              [Console]::Out.WriteLine('ACL_MODE=' + $script:XB155AclMode + ';SE_SECURITY_PRIVILEGE=' + $script:XB155AclPrivilege)
              [Console]::Out.Flush()
              $script:XB155AclAttemptCount = 1
              [Console]::Out.WriteLine('ACL_ATTEMPT_STARTED')
              [Console]::Out.Flush()
              $upgradeResult = Invoke-XbFixtureOperation 'Upgrade'
              $script:XB155AclSetterActive = $false
              if ($upgradeResult -ceq 'pass') { $script:XB155AclUpgradeOutcome = 'pass' }
              elseif ($upgradeResult -match '^upgrade_[a-z0-9_]+$') { $script:XB155AclUpgradeOutcome = [string]$upgradeResult }
              else { $script:XB155AclUpgradeOutcome = 'failure_sanitized' }

              $paths = Get-XbWorkerUpgradePaths
              $journalState = 'absent'
              $candidatePresent = $false
              $previousPresent = $false
              if (Test-Path -LiteralPath $paths.journal) {
                  try {
                      $journal = Read-XbWorkerUpgradeJournal -Path $paths.journal
                      $journalState = [string]$journal.state
                      if ($journalState -notin @('preparing','staged','old_move_intent','new_move_intent','complete','rollback_new_intent','rollback_old_intent','rolled_back','aborted')) { $journalState = 'other' }
                      $candidatePresent = Test-Path -LiteralPath ([string]$journal.candidate_root)
                      $previousPresent = Test-Path -LiteralPath ([string]$journal.previous_root)
