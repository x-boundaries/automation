              debugger_breakpoints_removed = [bool]$script:XB155AclBreakpointsRemoved
              observer_fault = [string]$script:XB155AclObserverFault
              setup_failure = [bool]($null -ne $script:XB155AclSetupFailure)
          }
          [Console]::Out.WriteLine('ACL_DIAGNOSTIC_JSON=' + ($report | ConvertTo-Json -Depth 8 -Compress))
          exit 0
          '@

            $executionState = 'temporary_harness_creation'
            [IO.File]::WriteAllText($harnessPath, $harnessPrefix + [Environment]::NewLine + $addon, [Text.UTF8Encoding]::new($false))
            $parseTokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($harnessPath, [ref]$parseTokens, [ref]$parseErrors)
            if (@($parseErrors).Count -gt 0) { throw 'temporary_harness_parse_failed' }

            $executionState = 'native_harness_execution'
            $native = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
            $arguments = @('-ExecutionPolicy','Bypass','-NoLogo','-NoProfile','-NonInteractive','-File',$harnessPath,'-InstallerPath',$installerPath,'-WorkRoot',$workRoot)
            if (@($arguments | Where-Object { $_.Contains('"') }).Count -gt 0) { throw 'native_argument_quote_unexpected' }
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $native
            $psi.Arguments = (($arguments | ForEach-Object { '"' + $_ + '"' }) -join ' ')
            $psi.WorkingDirectory = $env:GITHUB_WORKSPACE
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $currentEnvironment = [Environment]::GetEnvironmentVariables()
            foreach ($key in $currentEnvironment.Keys) {
              if ([string]$key -cne 'PSModulePath') { $psi.EnvironmentVariables[[string]$key] = [string]$currentEnvironment[$key] }
            }
            $systemRoot = if (-not [string]::IsNullOrWhiteSpace($env:SystemRoot)) { $env:SystemRoot } else { 'C:\Windows' }
            $programFiles = if (-not [string]::IsNullOrWhiteSpace($env:ProgramFiles)) { $env:ProgramFiles } else { 'C:\Program Files' }
            $systemModules = Join-Path $systemRoot 'System32\WindowsPowerShell\v1.0\Modules'
            $programModules = Join-Path $programFiles 'WindowsPowerShell\Modules'
            $psi.EnvironmentVariables['PSModulePath'] = [string]::Join([IO.Path]::PathSeparator, @($systemModules,$programModules))
            $process = New-Object System.Diagnostics.Process
            $process.StartInfo = $psi
            if (-not $process.Start()) { throw 'native_harness_start_failed' }
            $stdoutTask = $process.StandardOutput.ReadToEndAsync()
            $stderrTask = $process.StandardError.ReadToEndAsync()
            $finished = $process.WaitForExit(840000)
            if (-not $finished) {
              try { $process.Kill(); $process.WaitForExit() } catch { }
            }
            $childTimedOut = -not $finished
            $childExitCode = if ($finished) { [int]$process.ExitCode } else { 124 }
            $childOutput = $stdoutTask.Result
            $childError = $stderrTask.Result
            $childLines = @(([string]$childOutput) -split '\r?\n')
            $childErrorLines = @(([string]$childError) -split '\r?\n')
            $childBoundary = Get-XB155ChildDiagnosticBoundary -StdoutLines $childLines -StderrLines $childErrorLines
            $childReportStatus = [string]$childBoundary.status
            $childProtocolMarkers = $childBoundary.protocol_markers
            $childLastObservedAclStage = [string]$childBoundary.last_observed_acl_stage
            if ($childBoundary.status -ceq 'accepted') {
              $report = $childBoundary.report
              $attempts = [int]$childBoundary.attempts
              Add-Member -InputObject $report -NotePropertyName child_exit_code -NotePropertyValue ([int]$childExitCode) -Force
              Add-Member -InputObject $report -NotePropertyName child_timed_out -NotePropertyValue ([bool]$childTimedOut) -Force
              $executionState = 'report_received'
            } else {
              $report = [ordered]@{
                original_function_fidelity = 'unverified'
                positive_upgrade_attempts = 'unknown'
                positive_upgrade_outcome = 'unknown'
                diagnostic_state = 'child_report_' + $childReportStatus
                child_report_status = $childReportStatus
                child_protocol_markers = $childProtocolMarkers
                failure_stage = $childLastObservedAclStage
                failure_stage_source = if ($childLastObservedAclStage -ceq 'unknown') { 'unobserved' } else { 'last_observed_acl_progress_marker' }
                exception_type = 'unobserved'
                hresult = 'unobserved'
                acl_target_equality = @()
                state_before = $null
                state_after = $null
                child_exit_code = [int]$childExitCode
