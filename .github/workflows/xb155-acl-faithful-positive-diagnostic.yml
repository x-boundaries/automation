              }
              $installAfter = Get-XbFixtureTreeSnapshot -Root $script:InstallRoot
              $taskAfter = Get-XbFixtureTaskSnapshot
              $runtimeAfter = Get-XbFixtureRuntimeSnapshot
              $script:XB155AclAfter = [ordered]@{
