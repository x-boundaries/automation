                $hr = '0x' + ([int]$_.Exception.HResult).ToString('X8')
              }
            } catch { }
            $setupFailure = [ordered]@{ state = $executionState; exception_type = $type; hresult = $hr }
          } finally {
            if ($rootCreated) {
              try {
                $resolvedRoot = [IO.Path]::GetFullPath($runRoot)
                if (-not $resolvedRoot.StartsWith($tempParentPrefix, [StringComparison]::OrdinalIgnoreCase) -or
                    [IO.Path]::GetFileName($resolvedRoot) -notmatch '^xbg3-[0-9a-f]{32}$') {
                  throw 'cleanup_scope_invalid'
                }
                Remove-Item -LiteralPath $resolvedRoot -Recurse -Force -ErrorAction Stop
                $rootRemoved = -not (Test-Path -LiteralPath $resolvedRoot)
                $fixtureRemoved = -not (Test-Path -LiteralPath $workRoot)
                $cleanup = [ordered]@{
                  outcome = if ($rootRemoved -and $fixtureRemoved) { 'removed' } else { 'residual' }
                  fixture_root_removed = [bool]$fixtureRemoved
                  xbg3_root_removed = [bool]$rootRemoved
                }
              } catch {
                $cleanup = [ordered]@{
                  outcome = 'failed_or_scope_hold'
                  fixture_root_removed = [bool](-not (Test-Path -LiteralPath $workRoot))
                  xbg3_root_removed = [bool](-not (Test-Path -LiteralPath $runRoot))
                }
              }
            }
          }

          if ($null -eq $report) {
            $report = [ordered]@{
              original_function_fidelity = 'unverified'
              positive_upgrade_attempts = if ($null -ne $attempts) { [int]$attempts } else { 'unknown' }
              diagnostic_state = if ($null -ne $setupFailure) { [string]$setupFailure.state } else { 'unknown' }
              child_report_status = [string]$childReportStatus
              child_protocol_markers = $childProtocolMarkers
              failure_stage = [string]$childLastObservedAclStage
              failure_stage_source = if ($childLastObservedAclStage -ceq 'unknown') { 'unobserved' } else { 'last_observed_acl_progress_marker' }
              exception_type = if ($null -ne $setupFailure) { [string]$setupFailure.exception_type } else { 'unobserved' }
              hresult = if ($null -ne $setupFailure) { [string]$setupFailure.hresult } else { 'unobserved' }
            }
          }
          Add-Member -InputObject $report -NotePropertyName cleanup -NotePropertyValue $cleanup -Force
          Write-Output ('ACL_DIAGNOSTIC_JSON=' + ($report | ConvertTo-Json -Depth 9 -Compress))

          if ($cleanup.outcome -cne 'removed') { throw 'synthetic_temp_cleanup_not_proven' }
          if ([bool]$report.child_timed_out) { throw 'native_harness_timeout' }
          if ([int]$report.child_exit_code -ne 0) { throw 'native_harness_exit_not_zero' }
          if ($attempts -ne 1) { throw 'one_positive_upgrade_attempt_not_completed' }
          if ($report.positive_upgrade_outcome -cne 'pass') { throw 'positive_upgrade_failed' }
          if ([bool]$report.setup_failure -or [string]$report.observer_fault -cne 'none') { throw 'passive_observer_integrity_failed' }
          if (-not [bool]$report.debugger_breakpoints_removed) { throw 'passive_debugger_cleanup_failed' }
