name: xb155-acl-faithful-positive-diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened]
    paths:
      - ".github/workflows/xb155-acl-faithful-positive-diagnostic.yml"

permissions:
  contents: read

jobs:
  one-shot-windows:
    if: >-
      github.repository == 'x-boundaries/automation' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'opened' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'codex/xb155-acl-faithful-g0-006-wj' &&
      github.event.pull_request.head.repo.full_name == 'x-boundaries/automation'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout frozen product source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: x-boundaries/automation
          ref: ad8bef9cd807a9d02c4497beb000735ec5ecfc32
          fetch-depth: 2
          persist-credentials: false

      - name: Verify frozen product commit identity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedHead = 'ad8bef9cd807a9d02c4497beb000735ec5ecfc32'
          $expectedTree = '7158011fe5adc3e5fee4a2ed871ece57a9fd26f7'
          $expectedParent = '2753923a99da20191baa8dd51393267b3c625c80'
          $actualHead = (git rev-parse HEAD 2>$null).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'product_head_read_failed' }
          $actualTree = (git rev-parse 'HEAD^{tree}' 2>$null).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'product_tree_read_failed' }
          $parentLine = (git rev-list --parents -n 1 HEAD 2>$null).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'product_parent_read_failed' }
          $parts = @($parentLine -split '\s+')
          if ($actualHead -cne $expectedHead -or $actualTree -cne $expectedTree -or
              $parts.Count -ne 2 -or $parts[0] -cne $expectedHead -or $parts[1] -cne $expectedParent) {
            throw 'frozen_product_identity_mismatch'
          }
          Write-Output "product_head=$actualHead"
          Write-Output "product_tree=$actualTree"
          Write-Output "product_parent=$expectedParent"

      - name: Run one synthetic positive Upgrade with passive ACL breakpoints
        shell: powershell
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSEdition -cne 'Desktop' -or $PSVersionTable.PSVersion.Major -ne 5 -or
              $PSVersionTable.PSVersion.Minor -ne 1 -or [IntPtr]::Size -ne 8) {
            throw 'native_64_bit_windows_powershell_5_1_required'
          }
          function Get-XB155ChildDiagnosticBoundary {
            param([string[]]$StdoutLines, [string[]]$StderrLines)

            $reportPrefix = 'ACL_DIAGNOSTIC_JSON='
            $modeLines = @($StdoutLines | Where-Object { $_.StartsWith('ACL_MODE=', [StringComparison]::Ordinal) })
            $attemptLines = @($StdoutLines | Where-Object { $_ -ceq 'ACL_ATTEMPT_STARTED' })
            $reportLines = @($StdoutLines | Where-Object { $_.StartsWith($reportPrefix, [StringComparison]::Ordinal) })
            $progressLines = @($StderrLines | Where-Object { $_.StartsWith('ACL_PROGRESS=', [StringComparison]::Ordinal) })

            $allowedStages = @(
              'preimage_get_acl',
              'preimage_canonical_check',
              'preimage_descriptor_serialization',
              'set_get_acl',
              'descriptor_application',
              'set_acl',
              'readback_get_acl',
              'readback_canonical_check',
              'readback_descriptor_serialization',
              'post_readback_comparison'
            )
            $lastObservedStage = 'unknown'
            if ($progressLines.Count -gt 0) {
              $progressPayload = $progressLines[$progressLines.Count - 1].Substring('ACL_PROGRESS='.Length)
              $separator = $progressPayload.IndexOf(';')
              if ($separator -gt 0) {
                $stageCandidate = $progressPayload.Substring(0, $separator)
                if ($allowedStages -ccontains $stageCandidate) { $lastObservedStage = $stageCandidate }
              }
            }

            $status = if ($reportLines.Count -eq 0) { 'missing' } elseif ($reportLines.Count -gt 1) { 'duplicate' } else { 'malformed' }
            $parsedReport = $null
            $reportedAttempts = $null
            if ($reportLines.Count -eq 1) {
              $payload = $reportLines[0].Substring($reportPrefix.Length)
              try {
                $parsedReport = ConvertFrom-Json -InputObject $payload -ErrorAction Stop
                $status = 'parsed'
              } catch {
                $parsedReport = $null
                $status = 'malformed'
              }

              if ($status -ceq 'parsed') {
                $attemptProperty = $null
                if ($null -ne $parsedReport -and $parsedReport -is [pscustomobject]) {
                  $attemptProperty = $parsedReport.PSObject.Properties['positive_upgrade_attempts']
                }
                $attemptValue = if ($null -ne $attemptProperty) { $attemptProperty.Value } else { $null }
                $integerTypes = @(
                  'System.Byte', 'System.SByte', 'System.Int16', 'System.UInt16',
                  'System.Int32', 'System.UInt32', 'System.Int64', 'System.UInt64'
                )
                $valueType = if ($null -ne $attemptValue) { $attemptValue.GetType().FullName } else { '' }
                if ($null -eq $attemptProperty -or $integerTypes -cnotcontains $valueType) {
                  $status = 'invalid_schema'
                } else {
                  if ($attemptValue -lt 0 -or $attemptValue -gt 1) {
                    $status = 'invalid_schema'
                  } else {
                    $reportedAttempts = [int]$attemptValue
                    $status = 'accepted'
                  }
                }
              }
            }

            if ($status -cne 'accepted') { $parsedReport = $null; $reportedAttempts = $null }
            $markers = [ordered]@{
              acl_mode_present = [bool]($modeLines.Count -gt 0)
              acl_attempt_started_present = [bool]($attemptLines.Count -gt 0)
              acl_diagnostic_json_line_count = [int]$reportLines.Count
              acl_progress_present = [bool]($progressLines.Count -gt 0)
            }
            return [pscustomobject]@{
              status = [string]$status
              report = $parsedReport
              attempts = $reportedAttempts
              protocol_markers = $markers
              last_observed_acl_stage = [string]$lastObservedStage
            }
          }
          $localAppData = $env:LOCALAPPDATA
          if ([string]::IsNullOrWhiteSpace($localAppData)) { throw 'localappdata_missing' }
          $tempParent = [IO.Path]::GetFullPath((Join-Path $localAppData 'Temp'))
          if (-not (Test-Path -LiteralPath $tempParent -PathType Container)) { throw 'original_temp_parent_missing' }
          $tempParentPrefix = $tempParent.TrimEnd([IO.Path]::DirectorySeparatorChar) + [IO.Path]::DirectorySeparatorChar
          $runRoot = [IO.Path]::GetFullPath((Join-Path $tempParent ('xbg3-' + [guid]::NewGuid().ToString('N'))))
          if (-not $runRoot.StartsWith($tempParentPrefix, [StringComparison]::OrdinalIgnoreCase) -or
              [IO.Path]::GetFileName($runRoot) -notmatch '^xbg3-[0-9a-f]{32}$') {
            throw 'original_temp_root_scope_invalid'
          }
          $workRoot = Join-Path $runRoot 'f'
          $harnessPath = Join-Path $runRoot 'upgrade_rollback_harness.ps1'
          $installerPath = Join-Path $env:GITHUB_WORKSPACE 'scripts\install_ac2_member_gateway_worker.ps1'
          $modulePath = Join-Path $env:GITHUB_WORKSPACE 'tests\test_member_gateway_worker_deployment.py'
          $executionState = 'root_setup'
          $rootCreated = $false
          $attempts = $null
          $report = $null
          $setupFailure = $null
          $childReportStatus = 'not_started'
          $childProtocolMarkers = [ordered]@{
            acl_mode_present = 'unknown'
            acl_attempt_started_present = 'unknown'
            acl_diagnostic_json_line_count = 'unknown'
            acl_progress_present = 'unknown'
          }
          $childLastObservedAclStage = 'unknown'
          $cleanup = [ordered]@{
            outcome = 'not_created'
            fixture_root_removed = $false
            xbg3_root_removed = $false
          }

          try {
            New-Item -ItemType Directory -Path $runRoot -ErrorAction Stop | Out-Null
            $rootCreated = $true
            New-Item -ItemType Directory -Path $workRoot -ErrorAction Stop | Out-Null

            $executionState = 'source_blob_verification'
            $installerBlob = (git hash-object -- $installerPath 2>$null).Trim()
            if ($LASTEXITCODE -ne 0 -or $installerBlob -cne '8e5d16c174a88690f1bf2f2daec9ddd1d60f1415') {
              throw 'frozen_installer_blob_mismatch'
            }
            $moduleBlob = (git hash-object -- $modulePath 2>$null).Trim()
            if ($LASTEXITCODE -ne 0 -or $moduleBlob -cne '3501a55a0e8b80658fe0536f26f83e1a39ba4fb3') {
              throw 'frozen_fixture_source_blob_mismatch'
            }

            $executionState = 'original_fixture_extraction'
            $moduleText = [IO.File]::ReadAllText($modulePath)
            $marker = "_LOCAL_UPGRADE_ROLLBACK_HARNESS = r'''"
            $start = $moduleText.IndexOf($marker, [StringComparison]::Ordinal)
            if ($start -lt 0) { throw 'original_fixture_source_marker_missing' }
            if ($moduleText.IndexOf($marker, $start + $marker.Length, [StringComparison]::Ordinal) -ge 0) {
              throw 'original_fixture_source_marker_ambiguous'
            }
            $start += $marker.Length
            $end = $moduleText.IndexOf("'''", $start, [StringComparison]::Ordinal)
            if ($end -lt 0) { throw 'original_fixture_source_terminator_missing' }
            $harnessSource = $moduleText.Substring($start, $end - $start)
            $boundary = '# Positive dispatcher path.'
            $cut = $harnessSource.IndexOf($boundary, [StringComparison]::Ordinal)
            if ($cut -lt 0 -or $harnessSource.IndexOf($boundary, $cut + $boundary.Length, [StringComparison]::Ordinal) -ge 0) {
              throw 'original_positive_fixture_boundary_invalid'
            }
            $harnessPrefix = $harnessSource.Substring(0, $cut)

            $addon = @'
          $script:XB155AclRows = New-Object System.Collections.ArrayList
          $script:XB155AclBreakpoints = New-Object System.Collections.ArrayList
          $script:XB155AclOrdinal = 0
          $script:XB155AclSetterActive = $false
          $script:XB155AclStage = 'not_started'
          $script:XB155AclRole = 'unknown'
          $script:XB155AclCurrentRow = $null
          $script:XB155AclFailure = $null
          $script:XB155AclObserverFault = 'none'
          $script:XB155AclAttemptCount = 0
          $script:XB155AclUpgradeOutcome = 'not_run'
          $script:XB155AclSetupFailure = $null
          $script:XB155AclBreakpointsRemoved = $false
          $script:XB155AclBefore = $null
          $script:XB155AclAfter = $null
          $script:XB155AclPrivilege = 'query_error'
          $script:XB155AclMode = if ($script:auditAclEvidence -ceq 'native') {
              'native_sacl'
          } elseif ([string]$script:auditAclEvidence -like 'synthetic_dacl_only:*') {
              'dacl_only_fallback'
          } else {
              'unknown'
          }

          function Get-XB155AclExistingRole {
              param([Parameter(Mandatory)][string]$Path)
              try {
                  $full = [IO.Path]::GetFullPath($Path).TrimEnd([IO.Path]::DirectorySeparatorChar)
                  $install = [IO.Path]::GetFullPath($script:InstallRoot).TrimEnd([IO.Path]::DirectorySeparatorChar)
                  if ($full -ceq $install) { return 'installed_root' }
                  if ($full.StartsWith($install + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
                      if ([IO.Path]::GetFileName($full) -ceq 'installation-manifest.json') { return 'installed_manifest' }
                      return 'installed_package_file'
                  }
                  return 'other'
              } catch { return 'unknown' }
          }

          function Get-XB155AclFingerprint {
              param([object]$Acl)
              if ($null -eq $Acl) { return 'NULL' }
              $values = New-Object 'System.Collections.Generic.List[string]'
              for ($i = 0; $i -lt $Acl.Count; $i++) {
                  $ace = $Acl[$i]
                  $bytes = New-Object byte[] $ace.BinaryLength
                  $ace.GetBinaryForm($bytes, 0)
                  [void]$values.Add([Convert]::ToBase64String($bytes))
              }
              $sorted = [string[]]$values.ToArray()
              [Array]::Sort($sorted, [StringComparer]::Ordinal)
              return [string]::Join(',', $sorted)
          }

          function Get-XB155AclComponentEquality {
              param([Parameter(Mandatory)][string]$Expected, [Parameter(Mandatory)][string]$Actual)
              try {
                  $before = [Security.AccessControl.RawSecurityDescriptor]::new($Expected)
                  $after = [Security.AccessControl.RawSecurityDescriptor]::new($Actual)
                  $auto = [int]([Security.AccessControl.ControlFlags]::DiscretionaryAclAutoInherited -bor [Security.AccessControl.ControlFlags]::SystemAclAutoInherited)
                  $beforeFlags = [int]$before.ControlFlags -band (-bnot $auto)
                  $afterFlags = [int]$after.ControlFlags -band (-bnot $auto)
                  $sacl = 'unobserved'
                  if ($script:XB155AclMode -ceq 'native_sacl') {
                      $sacl = [bool]((Get-XB155AclFingerprint $before.SystemAcl) -ceq (Get-XB155AclFingerprint $after.SystemAcl))
                  }
                  return [ordered]@{
                      owner = [bool](([string]$before.Owner) -ceq ([string]$after.Owner))
                      group = [bool](([string]$before.Group) -ceq ([string]$after.Group))
                      control_flags = [bool]($beforeFlags -eq $afterFlags)
                      dacl = [bool]((Get-XB155AclFingerprint $before.DiscretionaryAcl) -ceq (Get-XB155AclFingerprint $after.DiscretionaryAcl))
                      sacl = $sacl
                  }
              } catch {
                  $saclValue = if ($script:XB155AclMode -ceq 'native_sacl') { 'unknown' } else { 'unobserved' }
                  return [ordered]@{ owner = 'unknown'; group = 'unknown'; control_flags = 'unknown'; dacl = 'unknown'; sacl = $saclValue }
              }
          }

          function Set-XB155AclFailure {
              param([string]$Stage, [string]$Role, [object]$ErrorRecord)
              if ($null -eq $script:XB155AclFailure) {
                  $script:XB155AclFailure = [ordered]@{
                      stage = if ([string]::IsNullOrWhiteSpace($Stage)) { 'unknown' } else { $Stage }
                      target_role = if ([string]::IsNullOrWhiteSpace($Role)) { 'unknown' } else { $Role }
                      exception_type = 'unobserved'
                      hresult = 'unobserved'
                  }
              }
              try {
                  if ($null -ne $ErrorRecord -and $null -ne $ErrorRecord.Exception) {
                      if ([string]$script:XB155AclFailure.exception_type -eq 'unobserved') {
                          $script:XB155AclFailure.exception_type = [string]$ErrorRecord.Exception.GetType().FullName
                          $script:XB155AclFailure.hresult = '0x' + ([int]$ErrorRecord.Exception.HResult).ToString('X8')
                      }
                  }
              } catch { }
              if ($null -ne $script:XB155AclCurrentRow) {
                  $script:XB155AclCurrentRow.failure_stage = [string]$script:XB155AclFailure.stage
                  $script:XB155AclCurrentRow.exception_type = [string]$script:XB155AclFailure.exception_type
                  $script:XB155AclCurrentRow.hresult = [string]$script:XB155AclFailure.hresult
              }
          }

          function Write-XB155AclProgress {
              param([string]$Stage, [string]$Role)
              [Console]::Error.WriteLine('ACL_PROGRESS=' + $Stage + ';' + $Role)
              [Console]::Error.Flush()
          }

          function Find-XB155OneLine {
              param([string[]]$Lines, [string]$Text, [int]$Start = 0, [int]$End = -1)
              if ($End -lt 0 -or $End -gt $Lines.Count) { $End = $Lines.Count }
              $hits = New-Object System.Collections.ArrayList
              for ($i = $Start; $i -lt $End; $i++) {
                  if ($Lines[$i].Trim() -ceq $Text) { [void]$hits.Add($i + 1) }
              }
              if ($hits.Count -ne 1) { throw 'passive_debugger_anchor_not_unique' }
              return [int]$hits[0]
          }

          function Add-XB155AclBreakpoint {
              param([string]$ScriptPath, [int]$Line, [scriptblock]$Action)
              $bp = Set-PSBreakpoint -Script $ScriptPath -Line $Line -Action $Action -ErrorAction Stop
              if (@($bp).Count -ne 1 -or -not [bool]$bp.Enabled -or [int]$bp.Line -ne $Line) {
                  throw 'passive_debugger_breakpoint_registration_failed'
              }
              [void]$script:XB155AclBreakpoints.Add($bp)
          }

          $actionGetterGet = {
              try {
                  if ($script:XB155AclSetterActive) {
                      $script:XB155AclStage = 'readback_get_acl'
                      Write-XB155AclProgress -Stage $script:XB155AclStage -Role $script:XB155AclRole
                  } else {
                      $script:XB155AclStage = 'preimage_get_acl'
                      $script:XB155AclRole = Get-XB155AclExistingRole -Path $Path
                      Write-XB155AclProgress -Stage $script:XB155AclStage -Role $script:XB155AclRole
                  }
              } catch { $script:XB155AclObserverFault = 'stage_capture_failed' }
          }
          $actionGetterCanonical = {
              try {
                  $script:XB155AclStage = if ($script:XB155AclSetterActive) { 'readback_canonical_check' } else { 'preimage_canonical_check' }
                  Write-XB155AclProgress -Stage $script:XB155AclStage -Role $script:XB155AclRole
              } catch { $script:XB155AclObserverFault = 'stage_capture_failed' }
          }
          $actionGetterSddl = {
              try {
                  $script:XB155AclStage = if ($script:XB155AclSetterActive) { 'readback_descriptor_serialization' } else { 'preimage_descriptor_serialization' }
                  Write-XB155AclProgress -Stage $script:XB155AclStage -Role $script:XB155AclRole
              } catch { $script:XB155AclObserverFault = 'stage_capture_failed' }
          }
          $actionGetterCatch = {
              $capturedError = $null
              try { if ($Error.Count -gt 0) { $capturedError = $Error[0] } } catch { }
              try { Set-XB155AclFailure -Stage $script:XB155AclStage -Role $script:XB155AclRole -ErrorRecord $capturedError } catch {
                  $script:XB155AclObserverFault = 'failure_capture_failed'
              }
          }
          $actionSetterGet = {
              try {
                  $index = [int]$script:XB155AclOrdinal
                  $script:XB155AclOrdinal = $index + 1
                  $role = if ($index -eq 0) { 'candidate_root' }
                      elseif ($index -le 5) { 'package_file' }
                      elseif ($index -eq 6) { 'manifest' }
                      else { 'other' }
                  $script:XB155AclRole = $role
                  $script:XB155AclSetterActive = $true
                  $script:XB155AclStage = 'set_get_acl'
                  Write-XB155AclProgress -Stage $script:XB155AclStage -Role $script:XB155AclRole
                  $row = [ordered]@{ target_role = $role; component_equality = $null; failure_stage = $null; exception_type = $null; hresult = $null }
                  [void]$script:XB155AclRows.Add($row)
                  $script:XB155AclCurrentRow = $row
              } catch { $script:XB155AclObserverFault = 'target_capture_failed' }
          }
          $actionSetterApply = {
              try { $script:XB155AclStage = 'descriptor_application'; Write-XB155AclProgress -Stage $script:XB155AclStage -Role $script:XB155AclRole } catch { $script:XB155AclObserverFault = 'stage_capture_failed' }
          }
          $actionSetterSetAcl = {
              try { $script:XB155AclStage = 'set_acl'; Write-XB155AclProgress -Stage $script:XB155AclStage -Role $script:XB155AclRole } catch { $script:XB155AclObserverFault = 'stage_capture_failed' }
          }
          $actionSetterCatch = {
              $capturedError = $null
              try { if ($Error.Count -gt 0) { $capturedError = $Error[0] } } catch { }
              try { Set-XB155AclFailure -Stage $script:XB155AclStage -Role $script:XB155AclRole -ErrorRecord $capturedError } catch {
                  $script:XB155AclObserverFault = 'failure_capture_failed'
              }
          }
          $actionSetterReadback = {
              try { $script:XB155AclStage = 'readback_get_acl'; Write-XB155AclProgress -Stage $script:XB155AclStage -Role $script:XB155AclRole } catch { $script:XB155AclObserverFault = 'stage_capture_failed' }
          }
          $actionSetterCompare = {
              try {
                  $script:XB155AclStage = 'post_readback_comparison'
                  Write-XB155AclProgress -Stage $script:XB155AclStage -Role $script:XB155AclRole
                  if ($null -ne $script:XB155AclCurrentRow) {
                      $equality = Get-XB155AclComponentEquality -Expected $Sddl -Actual $actualSddl
                      $script:XB155AclCurrentRow.component_equality = $equality
                      $unequal = $false
                      foreach ($key in @('owner','group','control_flags','dacl','sacl')) {
                          if ($equality[$key] -is [bool] -and -not [bool]$equality[$key]) { $unequal = $true }
                      }
                      if ($unequal) { Set-XB155AclFailure -Stage 'post_readback_comparison' -Role $script:XB155AclRole -ErrorRecord $null }
                  }
              } catch { $script:XB155AclObserverFault = 'comparison_observer_failed' }
          }
          $actionOperationCatch = {
              $capturedError = $null
              try { if ($Error.Count -gt 0) { $capturedError = $Error[0] } } catch { }
              try { Set-XB155AclFailure -Stage $script:XB155AclStage -Role $script:XB155AclRole -ErrorRecord $capturedError } catch {
                  $script:XB155AclObserverFault = 'failure_capture_failed'
              }
          }

          try {
              if (@($packageFiles).Count -ne 5) { throw 'original_package_shape_unexpected' }
              if ($script:XB155AclMode -notin @('native_sacl','dacl_only_fallback')) { throw 'original_acl_selection_unclassified' }

              $copyBlob = (git hash-object -- $script:FixtureInstallerPath 2>$null).Trim()
              if ($LASTEXITCODE -ne 0 -or $copyBlob -cne '8e5d16c174a88690f1bf2f2daec9ddd1d60f1415') {
                  throw 'original_installer_copy_changed'
              }

              $null = Initialize-XbFixture 'positive'
              $paths = Get-XbWorkerUpgradePaths
              $installBefore = Get-XbFixtureTreeSnapshot -Root $script:InstallRoot
              $taskBefore = Get-XbFixtureTaskSnapshot
              $runtimeBefore = Get-XbFixtureRuntimeSnapshot
              $journalBefore = Test-Path -LiteralPath $paths.journal
              $installBeforeMatchesBaseline = $false
              try { Assert-XbWorkerUpgradePackageMatches -Root $script:InstallRoot -Expected $script:baseline; $installBeforeMatchesBaseline = $true } catch { }
              $taskBeforeMatchesBaseline = ($taskBefore -ceq $script:taskBaseline)
              $runtimeBeforeMatchesBaseline = ($runtimeBefore -ceq $script:runtimeBaseline)
              $script:XB155AclBefore = [ordered]@{
                  install_matches_baseline = [bool]$installBeforeMatchesBaseline
                  journal_present = [bool]$journalBefore
                  task_matches_baseline = [bool]$taskBeforeMatchesBaseline
                  runtime_matches_baseline = [bool]$runtimeBeforeMatchesBaseline
              }

              $privLines = @(& (Join-Path $env:SystemRoot 'System32\whoami.exe') /priv 2>$null | ForEach-Object { [string]$_ })
              if ($LASTEXITCODE -eq 0) {
                  $privRows = @($privLines | Where-Object { $_ -match '^\s*SeSecurityPrivilege\s+' })
                  if ($privRows.Count -eq 0) { $script:XB155AclPrivilege = 'not_present' }
                  elseif ($privRows.Count -gt 1) { $script:XB155AclPrivilege = 'ambiguous' }
                  elseif ($privRows[0] -match '(?i)\bEnabled\b') { $script:XB155AclPrivilege = 'enabled' }
                  elseif ($privRows[0] -match '(?i)\bDisabled\b') { $script:XB155AclPrivilege = 'disabled' }
                  else { $script:XB155AclPrivilege = 'listed_state_unclassified' }
              }

              $installerLines = [IO.File]::ReadAllLines($script:FixtureInstallerPath)
              $getterStart = Find-XB155OneLine -Lines $installerLines -Text 'function Get-XbWorkerUpgradeAclSddl {'
              $converterStart = Find-XB155OneLine -Lines $installerLines -Text 'function Convert-XbWorkerUpgradeAclSddl {'
              $setterStart = Find-XB155OneLine -Lines $installerLines -Text 'function Set-XbWorkerUpgradeAclSddl {'
              $journalSetterStart = Find-XB155OneLine -Lines $installerLines -Text 'function Set-XbWorkerUpgradeJournalAcl {'
              $getAclGetterLine = Find-XB155OneLine -Lines $installerLines -Text '$acl = Get-Acl -LiteralPath $Path -Audit -ErrorAction Stop' -Start ($getterStart - 1) -End ($converterStart - 1)
              $getterCanonicalLine = Find-XB155OneLine -Lines $installerLines -Text 'if (-not $acl.AreAccessRulesCanonical) { throw "acl_order_unproven" }' -Start ($getterStart - 1) -End ($converterStart - 1)
