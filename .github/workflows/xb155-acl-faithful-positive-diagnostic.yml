                      $script:XB155AclBreakpointsRemoved = $true
                  } else { $script:XB155AclBreakpointsRemoved = $true }
              } catch { $script:XB155AclBreakpointsRemoved = $false }
          }

          $failure = $script:XB155AclFailure
          $report = [ordered]@{
              original_function_fidelity = if ($script:XB155AclAttemptCount -eq 1) { 'verified_source_copy_passive_debugger' } else { 'not_executed' }
              positive_upgrade_attempts = [int]$script:XB155AclAttemptCount
              positive_upgrade_outcome = [string]$script:XB155AclUpgradeOutcome
              acl_selection = [string]$script:XB155AclMode
              se_security_privilege = [string]$script:XB155AclPrivilege
              failure_stage = if ($null -ne $failure) { [string]$failure.stage } elseif ($null -ne $script:XB155AclSetupFailure) { 'diagnostic_setup_failed' } else { 'none' }
              failure_target_role = if ($null -ne $failure) { [string]$failure.target_role } else { 'unknown' }
              exception_type = if ($null -ne $failure) { [string]$failure.exception_type } elseif ($null -ne $script:XB155AclSetupFailure) { [string]$script:XB155AclSetupFailure.type } else { 'none' }
              hresult = if ($null -ne $failure) { [string]$failure.hresult } elseif ($null -ne $script:XB155AclSetupFailure) { [string]$script:XB155AclSetupFailure.hresult } else { 'none' }
              acl_target_equality = @($script:XB155AclRows | ForEach-Object {
                  [ordered]@{ target_role = [string]$_.target_role; components = $_.component_equality }
              })
              state_before = $script:XB155AclBefore
              state_after = $script:XB155AclAfter
