name: xb155-candidate-root-acl-transform-witness

on:
  pull_request:
    branches: [main]
    types: [opened]
    paths:
      - ".github/workflows/xb155-candidate-root-acl-transform-witness.yml"

permissions:
  contents: read

jobs:
  one-shot-windows:
    if: >-
      github.repository == 'x-boundaries/automation' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'opened' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'codex/xb155-acl-controlflag-capture-g3-011-wj' &&
      github.event.pull_request.head.repo.full_name == 'x-boundaries/automation'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout frozen product source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: x-boundaries/automation
          ref: ad8bef9cd807a9d02c4497beb000735ec5ecfc32
          fetch-depth: 2
          persist-credentials: false

      - name: Verify frozen product commit identity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedHead = 'ad8bef9cd807a9d02c4497beb000735ec5ecfc32'
          $expectedTree = '7158011fe5adc3e5fee4a2ed871ece57a9fd26f7'
          $expectedParent = '2753923a99da20191baa8dd51393267b3c625c80'
          $actualHead = (git rev-parse HEAD 2>$null).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'product_head_read_failed' }
          $actualTree = (git rev-parse 'HEAD^{tree}' 2>$null).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'product_tree_read_failed' }
          $parentLine = (git rev-list --parents -n 1 HEAD 2>$null).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'product_parent_read_failed' }
          $parts = @($parentLine -split '\s+')
          if ($actualHead -cne $expectedHead -or $actualTree -cne $expectedTree -or
              $parts.Count -ne 2 -or $parts[0] -cne $expectedHead -or $parts[1] -cne $expectedParent) {
            throw 'frozen_product_identity_mismatch'
          }
          Write-Output "product_head=$actualHead"
          Write-Output "product_tree=$actualTree"
          Write-Output "product_parent=$expectedParent"

      - name: Run one synthetic positive Upgrade with passive ACL breakpoints
        shell: powershell
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSEdition -cne 'Desktop' -or $PSVersionTable.PSVersion.Major -ne 5 -or
              $PSVersionTable.PSVersion.Minor -ne 1 -or [IntPtr]::Size -ne 8) {
            throw 'native_64_bit_windows_powershell_5_1_required'
          }
          function Get-XB155ChildDiagnosticBoundary {
            param([string[]]$StdoutLines, [string[]]$StderrLines)

            $reportPrefix = 'ACL_DIAGNOSTIC_JSON='
            $modeLines = @($StdoutLines | Where-Object { $_.StartsWith('ACL_MODE=', [StringComparison]::Ordinal) })
            $attemptLines = @($StdoutLines | Where-Object { $_ -ceq 'ACL_ATTEMPT_STARTED' })
            $reportLines = @($StdoutLines | Where-Object { $_.StartsWith($reportPrefix, [StringComparison]::Ordinal) })
            $progressLines = @($StderrLines | Where-Object { $_.StartsWith('ACL_PROGRESS=', [StringComparison]::Ordinal) })

            $allowedStages = @(
              'preimage_get_acl',
              'preimage_canonical_check',
              'preimage_descriptor_serialization',
              'set_get_acl',
              'descriptor_application',
              'set_acl',
              'readback_get_acl',
              'readback_canonical_check',
              'readback_descriptor_serialization',
              'post_readback_comparison'
            )
            $lastObservedStage = 'unknown'
            if ($progressLines.Count -gt 0) {
              $progressPayload = $progressLines[$progressLines.Count - 1].Substring('ACL_PROGRESS='.Length)
              $separator = $progressPayload.IndexOf(';')
              if ($separator -gt 0) {
                $stageCandidate = $progressPayload.Substring(0, $separator)
                if ($allowedStages -ccontains $stageCandidate) { $lastObservedStage = $stageCandidate }
              }
            }

            $status = if ($reportLines.Count -eq 0) { 'missing' } elseif ($reportLines.Count -gt 1) { 'duplicate' } else { 'malformed' }
            $parsedReport = $null
            $reportedAttempts = $null
            if ($reportLines.Count -eq 1) {
              $payload = $reportLines[0].Substring($reportPrefix.Length)
              try {
                $parsedReport = ConvertFrom-Json -InputObject $payload -ErrorAction Stop
                $status = 'parsed'
              } catch {
                $parsedReport = $null
                $status = 'malformed'
              }

              if ($status -ceq 'parsed') {
                $attemptProperty = $null
                if ($null -ne $parsedReport -and $parsedReport -is [pscustomobject]) {
                  $attemptProperty = $parsedReport.PSObject.Properties['positive_upgrade_attempts']
                }
                $attemptValue = if ($null -ne $attemptProperty) { $attemptProperty.Value } else { $null }
                $integerTypes = @(
                  'System.Byte', 'System.SByte', 'System.Int16', 'System.UInt16',
                  'System.Int32', 'System.UInt32', 'System.Int64', 'System.UInt64'
                )
                $valueType = if ($null -ne $attemptValue) { $attemptValue.GetType().FullName } else { '' }
                if ($null -eq $attemptProperty -or $integerTypes -cnotcontains $valueType) {
                  $status = 'invalid_schema'
                } else {
                  if ($attemptValue -lt 0 -or $attemptValue -gt 1) {
                    $status = 'invalid_schema'
                  } else {
                    $reportedAttempts = [int]$attemptValue
                    $status = 'accepted'
                  }
                }
              }
            }

            if ($status -cne 'accepted') { $parsedReport = $null; $reportedAttempts = $null }
            $markers = [ordered]@{
              acl_mode_present = [bool]($modeLines.Count -gt 0)
              acl_attempt_started_present = [bool]($attemptLines.Count -gt 0)
              acl_diagnostic_json_line_count = [int]$reportLines.Count
              acl_progress_present = [bool]($progressLines.Count -gt 0)
            }
            return [pscustomobject]@{
              status = [string]$status
              report = $parsedReport
              attempts = $reportedAttempts
              protocol_markers = $markers
              last_observed_acl_stage = [string]$lastObservedStage
            }
          }
          $localAppData = $env:LOCALAPPDATA
          if ([string]::IsNullOrWhiteSpace($localAppData)) { throw 'localappdata_missing' }
          $tempParent = [IO.Path]::GetFullPath((Join-Path $localAppData 'Temp'))
          if (-not (Test-Path -LiteralPath $tempParent -PathType Container)) { throw 'original_temp_parent_missing' }
          $tempParentPrefix = $tempParent.TrimEnd([IO.Path]::DirectorySeparatorChar) + [IO.Path]::DirectorySeparatorChar
          $runRoot = [IO.Path]::GetFullPath((Join-Path $tempParent ('xbg3-' + [guid]::NewGuid().ToString('N'))))
          if (-not $runRoot.StartsWith($tempParentPrefix, [StringComparison]::OrdinalIgnoreCase) -or
              [IO.Path]::GetFileName($runRoot) -notmatch '^xbg3-[0-9a-f]{32}$') {
            throw 'original_temp_root_scope_invalid'
          }
          $workRoot = Join-Path $runRoot 'f'
          $harnessPath = Join-Path $runRoot 'upgrade_rollback_harness.ps1'
          $installerPath = Join-Path $env:GITHUB_WORKSPACE 'scripts\install_ac2_member_gateway_worker.ps1'
          $modulePath = Join-Path $env:GITHUB_WORKSPACE 'tests\test_member_gateway_worker_deployment.py'
          $executionState = 'root_setup'
          $rootCreated = $false
          $attempts = $null
          $report = $null
          $setupFailure = $null
          $childReportStatus = 'not_started'
          $childProtocolMarkers = [ordered]@{
            acl_mode_present = 'unknown'
            acl_attempt_started_present = 'unknown'
            acl_diagnostic_json_line_count = 'unknown'
            acl_progress_present = 'unknown'
          }
          $childLastObservedAclStage = 'unknown'
          $cleanup = [ordered]@{
            outcome = 'not_created'
            fixture_root_removed = $false
            xbg3_root_removed = $false
          }

          try {
            New-Item -ItemType Directory -Path $runRoot -ErrorAction Stop | Out-Null
            $rootCreated = $true
            New-Item -ItemType Directory -Path $workRoot -ErrorAction Stop | Out-Null

            $executionState = 'source_blob_verification'
            $installerBlob = (git hash-object -- $installerPath 2>$null).Trim()
            if ($LASTEXITCODE -ne 0 -or $installerBlob -cne '8e5d16c174a88690f1bf2f2daec9ddd1d60f1415') {
              throw 'frozen_installer_blob_mismatch'
            }
            $moduleBlob = (git hash-object -- $modulePath 2>$null).Trim()
            if ($LASTEXITCODE -ne 0 -or $moduleBlob -cne '3501a55a0e8b80658fe0536f26f83e1a39ba4fb3') {
              throw 'frozen_fixture_source_blob_mismatch'
            }

            $executionState = 'original_fixture_extraction'
            $moduleText = [IO.File]::ReadAllText($modulePath)
            $marker = "_LOCAL_UPGRADE_ROLLBACK_HARNESS = r'''"
            $start = $moduleText.IndexOf($marker, [StringComparison]::Ordinal)
            if ($start -lt 0) { throw 'original_fixture_source_marker_missing' }
            if ($moduleText.IndexOf($marker, $start + $marker.Length, [StringComparison]::Ordinal) -ge 0) {
              throw 'original_fixture_source_marker_ambiguous'
            }
            $start += $marker.Length
            $end = $moduleText.IndexOf("'''", $start, [StringComparison]::Ordinal)
            if ($end -lt 0) { throw 'original_fixture_source_terminator_missing' }
            $harnessSource = $moduleText.Substring($start, $end - $start)
            $boundary = '# Positive dispatcher path.'
            $cut = $harnessSource.IndexOf($boundary, [StringComparison]::Ordinal)
            if ($cut -lt 0 -or $harnessSource.IndexOf($boundary, $cut + $boundary.Length, [StringComparison]::Ordinal) -ge 0) {
              throw 'original_positive_fixture_boundary_invalid'
            }
            $harnessPrefix = $harnessSource.Substring(0, $cut)

            $addon = @'
          $script:XB155AclRows = New-Object System.Collections.ArrayList
          $script:XB155AclStages = New-Object System.Collections.ArrayList
          $script:XB155AclBreakpoints = New-Object System.Collections.ArrayList
          $script:XB155AclOrdinal = 0
          $script:XB155AclSetterActive = $false
          $script:XB155AclObservationActive = $false
          $script:XB155AclStage = 'not_started'
          $script:XB155AclRole = 'unknown'
          $script:XB155AclCurrentTargetIsRoot = $false
          $script:XB155AclCurrentRow = $null
          $script:XB155AclFailure = $null
          $script:XB155AclObserverFault = 'none'
          $script:XB155AclAttemptCount = 0
          $script:XB155AclUpgradeOutcome = 'not_run'
          $script:XB155AclSetupFailure = $null
          $script:XB155AclBreakpointsRemoved = $false
          $script:XB155AclBefore = $null
          $script:XB155AclAfter = $null
          $script:XB155AclExpectedRootDaclFingerprint = $null
          $script:XB155AclComparisonWillFail = $null
          $script:XB155AclParentBeforeCanonical = $null
          $script:XB155AclParentCreateUnchanged = 'unobserved'
          $script:XB155AclControlsPassed = $false
          $script:XB155AclMode = if ($script:auditAclEvidence -ceq 'native') {
              'native_sacl'
          } elseif ([string]$script:auditAclEvidence -like 'synthetic_dacl_only:*') {
              'dacl_only_fallback'
          } else {
              'unknown'
          }
          $script:XB155AclPrivilege = 'query_error'
          $script:XB155AclOperations = [ordered]@{
              preimage_get_acl = 'not_reached'
              preimage_canonical_check = 'not_reached'
              preimage_descriptor_serialization = 'not_reached'
              candidate_get_acl = 'not_reached'
              descriptor_application = 'not_reached'
              set_acl = 'not_reached'
              os_post_set_acl_readback = 'not_reached'
              product_readback = 'not_reached'
              product_comparison = 'not_reached'
          }

          function Get-XB155AclExistingRole {
              param([Parameter(Mandatory)][string]$Path)
              try {
                  $full = [IO.Path]::GetFullPath($Path).TrimEnd([IO.Path]::DirectorySeparatorChar)
                  $install = [IO.Path]::GetFullPath($script:InstallRoot).TrimEnd([IO.Path]::DirectorySeparatorChar)
                  if ($full -ceq $install) { return 'installed_root' }
                  if ($full.StartsWith($install + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
                      if ([IO.Path]::GetFileName($full) -ceq 'installation-manifest.json') { return 'installed_manifest' }
                      return 'installed_package_file'
                  }
                  return 'other'
              } catch { return 'unknown' }
          }

          function Get-XB155AclFingerprint {
              param([object]$Acl)
              if ($null -eq $Acl) { return 'NULL' }
              $values = New-Object 'System.Collections.Generic.List[string]'
              for ($i = 0; $i -lt $Acl.Count; $i++) {
                  $ace = $Acl[$i]
                  $bytes = New-Object byte[] $ace.BinaryLength
                  $ace.GetBinaryForm($bytes, 0)
                  [void]$values.Add([Convert]::ToBase64String($bytes))
              }
              $sorted = [string[]]$values.ToArray()
              [Array]::Sort($sorted, [StringComparer]::Ordinal)
              return [string]::Join(',', $sorted)
          }

          function Get-XB155AclMetricsFromRawAcl {
              param([object]$Acl, [string]$ExpectedFingerprint)
              $total = if ($null -eq $Acl) { 0 } else { [int]$Acl.Count }
              $inherited = 0
              $explicit = 0
              $categories = [ordered]@{ object_inherit = 0; container_inherit = 0; no_propagate = 0; inherit_only = 0; inherited = 0 }
              if ($null -ne $Acl) {
                  for ($i = 0; $i -lt $Acl.Count; $i++) {
                      $bits = [int]$Acl[$i].AceFlags
                      if (($bits -band [int][Security.AccessControl.AceFlags]::Inherited) -ne 0) { $inherited++ } else { $explicit++ }
                      if (($bits -band [int][Security.AccessControl.AceFlags]::ObjectInherit) -ne 0) { $categories.object_inherit++ }
                      if (($bits -band [int][Security.AccessControl.AceFlags]::ContainerInherit) -ne 0) { $categories.container_inherit++ }
                      if (($bits -band [int][Security.AccessControl.AceFlags]::NoPropagateInherit) -ne 0) { $categories.no_propagate++ }
                      if (($bits -band [int][Security.AccessControl.AceFlags]::InheritOnly) -ne 0) { $categories.inherit_only++ }
                      if (($bits -band [int][Security.AccessControl.AceFlags]::Inherited) -ne 0) { $categories.inherited++ }
                  }
              }
              $fingerprint = Get-XB155AclFingerprint -Acl $Acl
              $equal = if ([string]::IsNullOrEmpty($ExpectedFingerprint)) { 'unknown' } else { [bool]($fingerprint -ceq $ExpectedFingerprint) }
              return [pscustomobject]@{
                  fingerprint = [string]$fingerprint
                  metrics = [ordered]@{
                      dacl_equal_to_expected_original = $equal
                      total_aces = [int]$total
                      inherited_aces = [int]$inherited
                      explicit_aces = [int]$explicit
                      inheritance_propagation_categories = $categories
                  }
              }
          }

          function Get-XB155AclMetricsFromSddl {
              param([Parameter(Mandatory)][string]$Sddl, [string]$ExpectedFingerprint)
              $descriptor = [Security.AccessControl.RawSecurityDescriptor]::new($Sddl)
              return Get-XB155AclMetricsFromRawAcl -Acl $descriptor.DiscretionaryAcl -ExpectedFingerprint $ExpectedFingerprint
          }

          function Get-XB155DaclControlBooleans {
              # Booleans only. The SDDL text is parsed here and never printed.
              param([Parameter(Mandatory)][string]$Sddl)
              $descriptor = [Security.AccessControl.RawSecurityDescriptor]::new($Sddl)
              $flags = [int]$descriptor.ControlFlags
              return [ordered]@{
                  dacl_protected = [bool]($flags -band [int][Security.AccessControl.ControlFlags]::DiscretionaryAclProtected)
                  dacl_auto_inherited = [bool]($flags -band [int][Security.AccessControl.ControlFlags]::DiscretionaryAclAutoInherited)
              }
          }

          function Add-XB155AclDaclStage {
              param([Parameter(Mandatory)][string]$Name, [Parameter(Mandatory)][string]$Role, [Parameter(Mandatory)][string]$Sddl, [switch]$CaptureExpected)
              $analysis = Get-XB155AclMetricsFromSddl -Sddl $Sddl -ExpectedFingerprint $script:XB155AclExpectedRootDaclFingerprint
              if ($CaptureExpected) {
                  $script:XB155AclExpectedRootDaclFingerprint = [string]$analysis.fingerprint
                  $analysis = Get-XB155AclMetricsFromSddl -Sddl $Sddl -ExpectedFingerprint $script:XB155AclExpectedRootDaclFingerprint
              }
              $controlBooleans = Get-XB155DaclControlBooleans -Sddl $Sddl
              $equalToOriginal = if ($Role -ceq 'candidate_parent') { 'not_applicable' } else { $analysis.metrics.dacl_equal_to_expected_original }
              [void]$script:XB155AclStages.Add([ordered]@{
                  stage = $Name
                  target_role = $Role
                  dacl_protected = [bool]$controlBooleans.dacl_protected
                  dacl_auto_inherited = [bool]$controlBooleans.dacl_auto_inherited
                  dacl_equal_to_expected_original = $equalToOriginal
                  total_aces = [int]$analysis.metrics.total_aces
                  inherited_aces = [int]$analysis.metrics.inherited_aces
                  explicit_aces = [int]$analysis.metrics.explicit_aces
                  inheritance_propagation_categories = $analysis.metrics.inheritance_propagation_categories
              })
          }

          function Add-XB155AclDaclStageFromAcl {
              param([Parameter(Mandatory)][string]$Name, [Parameter(Mandatory)][string]$Role, [Parameter(Mandatory)][object]$Acl)
              $sddl = $Acl.GetSecurityDescriptorSddlForm([Security.AccessControl.AccessControlSections]::All)
              Add-XB155AclDaclStage -Name $Name -Role $Role -Sddl $sddl
          }

          function Test-XB155AclStageOrder {
              param([string[]]$Names)
              $expected = @('A_original_expected','P_parent_before_candidate_create','Q_parent_after_candidate_create','R_candidate_after_create','B_candidate_pre_application','C_in_memory_post_application','D_os_post_set_acl','E_product_readback')
              if ($Names.Count -gt $expected.Count) { return $false }
              for ($i = 0; $i -lt $Names.Count; $i++) { if ($Names[$i] -cne $expected[$i]) { return $false } }
              return $true
          }

          function Test-XB155AclDiagnosticControls {
              $sid = [Security.Principal.SecurityIdentifier]::new([Security.Principal.WellKnownSidType]::WorldSid, $null)
              $sample = [Security.AccessControl.RawAcl]::new([byte]2, 2)
              $explicitFlags = [Security.AccessControl.AceFlags]([int][Security.AccessControl.AceFlags]::ObjectInherit -bor [int][Security.AccessControl.AceFlags]::ContainerInherit)
              $inheritedFlags = [Security.AccessControl.AceFlags]([int][Security.AccessControl.AceFlags]::NoPropagateInherit -bor [int][Security.AccessControl.AceFlags]::InheritOnly -bor [int][Security.AccessControl.AceFlags]::Inherited)
              $explicitAce = [Security.AccessControl.CommonAce]::new($explicitFlags, [Security.AccessControl.AceQualifier]::AccessAllowed, 1, $sid, $false, $null)
              $inheritedAce = [Security.AccessControl.CommonAce]::new($inheritedFlags, [Security.AccessControl.AceQualifier]::AccessAllowed, 1, $sid, $false, $null)
              $sample.InsertAce(0, $explicitAce)
              $sample.InsertAce(1, $inheritedAce)
              $expectedFingerprint = Get-XB155AclFingerprint -Acl $sample
              $positive = Get-XB155AclMetricsFromRawAcl -Acl $sample -ExpectedFingerprint $expectedFingerprint
              $empty = [Security.AccessControl.RawAcl]::new([byte]2, 0)
              $negative = Get-XB155AclMetricsFromRawAcl -Acl $empty -ExpectedFingerprint $expectedFingerprint
              $orderedPositive = Test-XB155AclStageOrder -Names @('A_original_expected','P_parent_before_candidate_create','Q_parent_after_candidate_create','R_candidate_after_create','B_candidate_pre_application','C_in_memory_post_application','D_os_post_set_acl','E_product_readback')
              $orderedNegative = Test-XB155AclStageOrder -Names @('A_original_expected','P_parent_before_candidate_create','Q_parent_after_candidate_create','B_candidate_pre_application','D_os_post_set_acl','C_in_memory_post_application')
              $protectedControl = Get-XB155DaclControlBooleans -Sddl 'D:P(A;OICI;FA;;;WD)'
              $unprotectedControl = Get-XB155DaclControlBooleans -Sddl 'D:(A;OICI;FA;;;WD)'
              $autoInheritedControl = Get-XB155DaclControlBooleans -Sddl 'D:AI(A;OICI;FA;;;WD)'
              if (-not [bool]$positive.metrics.dacl_equal_to_expected_original -or
                  [int]$positive.metrics.total_aces -ne 2 -or [int]$positive.metrics.inherited_aces -ne 1 -or
                  [int]$positive.metrics.explicit_aces -ne 1 -or
                  [int]$positive.metrics.inheritance_propagation_categories.object_inherit -ne 1 -or
                  [int]$positive.metrics.inheritance_propagation_categories.container_inherit -ne 1 -or
                  [int]$positive.metrics.inheritance_propagation_categories.no_propagate -ne 1 -or
                  [int]$positive.metrics.inheritance_propagation_categories.inherit_only -ne 1 -or
                  [int]$positive.metrics.inheritance_propagation_categories.inherited -ne 1 -or
                  [bool]$negative.metrics.dacl_equal_to_expected_original -or
                  [int]$negative.metrics.total_aces -ne 0 -or
                  -not $orderedPositive -or $orderedNegative -or -not [bool]$protectedControl.dacl_protected -or [bool]$unprotectedControl.dacl_protected -or -not [bool]$autoInheritedControl.dacl_auto_inherited -or [bool]$autoInheritedControl.dacl_protected) {
                  throw 'categorical_observer_controls_failed'
              }
              return $true
          }

          function Set-XB155AclFailure {
              param([string]$Stage, [string]$Role, [object]$ErrorRecord)
              if ($null -eq $script:XB155AclFailure) {
                  $script:XB155AclFailure = [ordered]@{
                      stage = if ([string]::IsNullOrWhiteSpace($Stage)) { 'unknown' } else { $Stage }
                      target_role = if ([string]::IsNullOrWhiteSpace($Role)) { 'unknown' } else { $Role }
                      exception_type = 'unobserved'
                      hresult = 'unobserved'
                  }
              }
              try {
                  if ($null -ne $ErrorRecord -and $null -ne $ErrorRecord.Exception) {
                      $script:XB155AclFailure.exception_type = [string]$ErrorRecord.Exception.GetType().FullName
                      $script:XB155AclFailure.hresult = '0x' + ([int]$ErrorRecord.Exception.HResult).ToString('X8')
                  }
              } catch { }
              if ($null -ne $script:XB155AclCurrentRow) {
                  $script:XB155AclCurrentRow.failure_stage = [string]$script:XB155AclFailure.stage
                  $script:XB155AclCurrentRow.exception_type = [string]$script:XB155AclFailure.exception_type
                  $script:XB155AclCurrentRow.hresult = [string]$script:XB155AclFailure.hresult
              }
              switch ([string]$script:XB155AclFailure.stage) {
                  'preimage_get_acl' { $script:XB155AclOperations.preimage_get_acl = 'failed' }
                  'preimage_canonical_check' { $script:XB155AclOperations.preimage_canonical_check = 'failed' }
                  'preimage_descriptor_serialization' { $script:XB155AclOperations.preimage_descriptor_serialization = 'failed' }
                  'set_get_acl' { $script:XB155AclOperations.candidate_get_acl = 'failed' }
                  'descriptor_application' { $script:XB155AclOperations.descriptor_application = 'failed' }
                  'set_acl' { $script:XB155AclOperations.set_acl = 'failed' }
                  'readback_get_acl' { $script:XB155AclOperations.product_readback = 'failed_get_acl' }
                  'readback_canonical_check' { $script:XB155AclOperations.product_readback = 'failed_canonical_check' }
                  'readback_descriptor_serialization' { $script:XB155AclOperations.product_readback = 'failed_serialization' }
                  'post_readback_comparison' { $script:XB155AclOperations.product_comparison = 'failed' }
              }
          }

          function Get-XB155AclErrorRecordForMessage {
              param([string]$Message)
              try {
                  foreach ($record in @($Error)) {
                      if ($null -ne $record -and $null -ne $record.Exception -and [string]$record.Exception.Message -ceq $Message) { return $record }
                  }
              } catch { }
              return $null
          }

          function Write-XB155AclProgress {
              param([string]$Stage, [string]$Role)
              [Console]::Error.WriteLine('ACL_PROGRESS=' + $Stage + ';' + $Role)
              [Console]::Error.Flush()
          }

          function Find-XB155OneLine {
              param([string[]]$Lines, [string]$Text, [int]$Start = 0, [int]$End = -1)
              if ($End -lt 0 -or $End -gt $Lines.Count) { $End = $Lines.Count }
              $hits = New-Object System.Collections.ArrayList
              for ($i = $Start; $i -lt $End; $i++) { if ($Lines[$i].Trim() -ceq $Text) { [void]$hits.Add($i + 1) } }
