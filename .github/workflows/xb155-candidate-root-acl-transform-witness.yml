          $actionSetterCompare = {
              if (-not $script:XB155AclObservationActive) { return }
              try {
                  $script:XB155AclStage = 'post_readback_comparison'
                  $script:XB155AclOperations.product_readback = 'success'
                  $script:XB155AclOperations.product_comparison = 'started'
                  if ($script:XB155AclCurrentTargetIsRoot) { Add-XB155AclDaclStage -Name 'E_product_readback' -Role 'candidate_root' -Sddl $actualSddl }
                  try {
                      $actualNormalized = Convert-XbWorkerUpgradeAclSddl $actualSddl
                      $expectedNormalized = Convert-XbWorkerUpgradeAclSddl $Sddl
