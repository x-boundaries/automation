              $installerLines = [IO.File]::ReadAllLines($script:FixtureInstallerPath)
              $getterStart = Find-XB155OneLine -Lines $installerLines -Text 'function Get-XbWorkerUpgradeAclSddl {'
              $converterStart = Find-XB155OneLine -Lines $installerLines -Text 'function Convert-XbWorkerUpgradeAclSddl {'
              $setterStart = Find-XB155OneLine -Lines $installerLines -Text 'function Set-XbWorkerUpgradeAclSddl {'
