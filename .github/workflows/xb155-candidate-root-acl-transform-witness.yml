              $getterSddlLine = Find-XB155OneLine -Lines $installerLines -Text 'return $acl.GetSecurityDescriptorSddlForm([Security.AccessControl.AccessControlSections]::All)' -Start ($getterStart - 1) -End ($converterStart - 1)
              $getterCatchLine = Find-XB155OneLine -Lines $installerLines -Text '} catch { throw "upgrade_acl_unverifiable" }' -Start ($getterStart - 1) -End ($converterStart - 1)
              $setAclGetterLine = Find-XB155OneLine -Lines $installerLines -Text '$acl = Get-Acl -LiteralPath $Path -Audit -ErrorAction Stop' -Start ($setterStart - 1) -End ($journalSetterStart - 1)
              $setterApplyLine = Find-XB155OneLine -Lines $installerLines -Text '$acl.SetSecurityDescriptorSddlForm($Sddl, [Security.AccessControl.AccessControlSections]::All)' -Start ($setterStart - 1) -End ($journalSetterStart - 1)
              $setterSetAclLine = Find-XB155OneLine -Lines $installerLines -Text 'Set-Acl -LiteralPath $Path -AclObject $acl -ErrorAction Stop' -Start ($setterStart - 1) -End ($journalSetterStart - 1)
              $setterCatchLine = Find-XB155OneLine -Lines $installerLines -Text '} catch { throw "upgrade_acl_preservation_failed" }' -Start ($setterStart - 1) -End ($journalSetterStart - 1)
