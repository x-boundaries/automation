              $candidateCopyLine = Find-XB155OneLine -Lines $installerLines -Text 'foreach ($name in $packageFiles) { Copy-Item -LiteralPath (Join-Path $PSScriptRoot $name) -Destination (Join-Path $journal.candidate_root $name) -ErrorAction Stop }' -Start ($upgradeStart - 1) -End ($rollbackStart - 1)
