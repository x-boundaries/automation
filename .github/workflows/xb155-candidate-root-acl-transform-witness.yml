          $actionGetterSddl = {
              if (-not $script:XB155AclObservationActive) { return }
              try {
                  if ($script:XB155AclSetterActive) {
                      $script:XB155AclStage = 'readback_descriptor_serialization'
                      $script:XB155AclOperations.product_readback = 'descriptor_serialization_started'
                  } else {
                      $script:XB155AclStage = 'preimage_descriptor_serialization'
