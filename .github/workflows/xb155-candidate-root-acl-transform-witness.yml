              } catch { $script:XB155AclObserverFault = 'parent_capture_failed' }
          }
          $actionCandidateCreatePost = {
              if (-not $script:XB155AclObservationActive) { return }
              try {
                  $parentAcl = Get-Acl -LiteralPath (Split-Path -Parent ([string]$journal.candidate_root)) -ErrorAction Stop
                  $parentCanonical = Convert-XbWorkerUpgradeAclSddl ($parentAcl.GetSecurityDescriptorSddlForm([Security.AccessControl.AccessControlSections]::All))
                  $script:XB155AclParentCreateUnchanged = [bool]($parentCanonical -ceq $script:XB155AclParentBeforeCanonical)
                  Add-XB155AclDaclStageFromAcl -Name 'Q_parent_after_candidate_create' -Role 'candidate_parent' -Acl $parentAcl
