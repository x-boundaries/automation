              $setterCompareLine = Find-XB155OneLine -Lines $installerLines -Text 'if ((Convert-XbWorkerUpgradeAclSddl $actualSddl) -cne (Convert-XbWorkerUpgradeAclSddl $Sddl)) { throw "upgrade_acl_preservation_failed" }' -Start ($setterStart - 1) -End ($journalSetterStart - 1)

              Add-XB155AclBreakpoint -ScriptPath $script:FixtureInstallerPath -Line $getAclGetterLine -Action $actionGetterGet
              Add-XB155AclBreakpoint -ScriptPath $script:FixtureInstallerPath -Line $getterCanonicalLine -Action $actionGetterCanonical
              Add-XB155AclBreakpoint -ScriptPath $script:FixtureInstallerPath -Line $getterSddlLine -Action $actionGetterSddl
              Add-XB155AclBreakpoint -ScriptPath $script:FixtureInstallerPath -Line $getterCatchLine -Action $actionGetterCatch
              Add-XB155AclBreakpoint -ScriptPath $script:FixtureInstallerPath -Line $setAclGetterLine -Action $actionSetterGet
              Add-XB155AclBreakpoint -ScriptPath $script:FixtureInstallerPath -Line $setterApplyLine -Action $actionSetterApply
              Add-XB155AclBreakpoint -ScriptPath $script:FixtureInstallerPath -Line $setterSetAclLine -Action $actionSetterSetAcl
              Add-XB155AclBreakpoint -ScriptPath $script:FixtureInstallerPath -Line $setterCatchLine -Action $actionSetterCatch
              Add-XB155AclBreakpoint -ScriptPath $script:FixtureInstallerPath -Line $setterReadbackLine -Action $actionSetterReadback
              Add-XB155AclBreakpoint -ScriptPath $script:FixtureInstallerPath -Line $setterCompareLine -Action $actionSetterCompare
