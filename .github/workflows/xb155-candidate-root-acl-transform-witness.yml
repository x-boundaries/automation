              try { if ($Error.Count -gt 0) { $capturedError = $Error[0] } } catch { }
              try { Set-XB155AclFailure -Stage $script:XB155AclStage -Role $script:XB155AclRole -ErrorRecord $capturedError } catch { $script:XB155AclObserverFault = 'failure_capture_failed' }
