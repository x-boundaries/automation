name: energygrid-bill-downloader-tests

on:
  pull_request:
    paths:
      - "energygrid-bill-downloader/**"
      - ".github/workflows/energygrid-bill-downloader-tests.yml"
      # EnergyGrid n8n error handler (#141): the source-controlled export, its focused
      # offline test, and the directory README that documents it. Exact entries, not a
      # broad n8n-workflows/** or tests/** glob, which would widen the reviewed trigger
      # surface beyond what this workflow owns.
      - "n8n-workflows/energygrid_download_error_handler.workflow.json"
      - "tests/test_energygrid_n8n_error_handler.py"
      - "n8n-workflows/README.md"
      - "README.md"
      - ".gitignore"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  synthetic-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert literal exact-head checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned test dependency
        shell: pwsh
        working-directory: energygrid-bill-downloader
        run: python -m pip install --requirement requirements.txt
      - name: Provision Chromium with official Playwright mechanism
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/energygrid-playwright
        shell: pwsh
        working-directory: energygrid-bill-downloader
        run: python -m playwright install chromium
      - name: PowerShell parse-only check
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "energygrid-bill-downloader/task-scheduler/register_task.example.ps1"),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if (@($errors).Count -gt 0) { throw "Scheduler example has parse errors." }
      - name: Project synthetic test suite
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/energygrid-playwright
        shell: pwsh
        working-directory: energygrid-bill-downloader
        run: python -m unittest discover -s tests -v
      - name: EnergyGrid n8n error handler focused test
        # The project suite above discovers only energygrid-bill-downloader/tests, so the
        # root-level focused test needs its own step. Standard library plus the runner's
        # Node, which executes the committed n8n expressions offline; no n8n instance.
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_energygrid_n8n_error_handler.py" -v
      - name: Scope and whitespace check
        shell: pwsh
        run: |
          $base = (git merge-base HEAD origin/main).Trim()
          git diff --check $base HEAD
          $files = @(git diff --name-only $base HEAD)
          $owned = @($files | Where-Object {
            $_ -match '^energygrid-bill-downloader/' -or
            $_ -eq '.github/workflows/energygrid-bill-downloader-tests.yml' -or
            $_ -eq 'n8n-workflows/energygrid_download_error_handler.workflow.json' -or
            $_ -eq 'tests/test_energygrid_n8n_error_handler.py'
          })
          if ($owned.Count -eq 0) {
            Write-Host "No EnergyGrid-owned path changed; EnergyGrid scope guard not applicable."
          } else {
            foreach ($file in $files) {
              if ($file -notmatch '^energygrid-bill-downloader/' -and
                  $file -ne '.github/workflows/energygrid-bill-downloader-tests.yml' -and
                  $file -ne 'n8n-workflows/energygrid_download_error_handler.workflow.json' -and
                  $file -ne 'tests/test_energygrid_n8n_error_handler.py' -and
                  $file -ne 'n8n-workflows/README.md' -and
                  $file -ne 'README.md' -and
                  $file -ne '.gitignore') {
                throw "Out-of-scope changed path: $file"
              }
            }
          }
